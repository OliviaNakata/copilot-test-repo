        <meta charset="utf-8">

        <style>
             @font-face { 
            font-family: 'Norwester'; 
            font-style: normal; 
            font-weight: 400; 
            src: url(https://cdn.jsdelivr.net/fontsource/fonts/norwester@latest/latin-400-normal.woff2) format('woff2'), 
                 url(https://cdn.jsdelivr.net/fontsource/fonts/norwester@latest/latin-400-normal.woff) format('woff'); 
             }

            #header {
                position: fixed;
                top: 0;
                width: 100%;
                height: 90px;
                padding: 0;
                margin: 0;
                box-sizing: border-box;
                z-index: 2000;
            }
            .header-content {
                width: 100%;
                height: auto;
                background: transparent;
                padding: 10px 0 0 0;
            }
            .screen-reader-text {
                border: 0;
                clip: rect(1px, 1px, 1px, 1px);
                clip-path: inset(50%);
                height: 1px;
                margin: -1px;
                overflow: hidden;
                padding: 0;
                position: absolute !important;
                width: 1px;
                word-wrap: normal  !important;
                word-break: normal;
            }
            .branding{
                height: 60px;
                width: 60px;
                background-color: transparent;
                display: inline-block;
                background-image: url('logo.png');
                background-size: contain; 
                background-position: center;
                margin: 10px;
                background-repeat: no-repeat;

            }
          .navbar-nav .nav-link{
            font-family: 'Fredoka', sans-serif; /* Change to your preferred font */
            font-weight: 900;
            margin-left: 20px
            }
            .navbar-nav, #social, #header{
               background-color: transparent;
            }
            #social i, .navbar-nav, .nav-link{
                color: black !important;
            }
            #social #header{
                float: none;
                display: block;
            }
            #social{
                padding: 10px;
                margin-right: 3px;
            }
            #social i{
                padding: 3px;
                margin: 3px 20px 1px;
                font-size: 2rem;
            }
            #social a {
                 text-decoration: none; /* This removes the underline! */
            }
            .header-links {
                display: inline-block;
                text-align: right;
                margin: 0;
            }
            .main{
                margin: 0;
                padding: 0;
                border: 0;
                font: inherit;
                vertical-align: baseline;
                bottom: 0; 
                left: 0; 
                right: 0; 
                top: 0;
            }
             .title{
                width: 100%;
                transform: translate(0%, 90%);

            }
            h2, h3, h4{
                font-family: 'Fredoka', sans-serif;
                text-align: center;
                display: block;
            }
            h1{
                font-family: 'Norwester', 'Arial Black', sans-serif; 
                font-size: 45px !important; 
                margin: 30px;
                padding: 10px;
                 text-align: center;
                display: block;
               
            }
            .calender{
                font-weight: bold;
                background-image:
                    radial-gradient(closest-corner circle at 28% 42%, #ff8c2e, #facc33);
                background-clip: text;
                color: transparent;
            }
            h2{
                font-size: 20px !important;
                margin-right: 50px;
                margin-left: 50px;
            }
            h3, h2 {
                 color: #ff8c2e !important;
            }
            .content{
                display: block;
                transform: translateY(80px);
                padding:20px;
            }
            .list{
                font-weight: bold;
                font-family:'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif, sans-serif;
                text-align: left;
                font-size: 130%;
                display: block;
            }
             @media screen and (max-width: 766px){
                #social i{
                    margin: 3px;
                }
            }
          
             #sns{
                width:100%;
                transform: translateY(250px);
                margin: 0 !important; 
                display: flex;
            }
             .y,.i{
                padding: 15px;
                font-weight: 350;
                text-decoration: none;
            }
            .box-1, .box-2{
                margin: 0;
                padding: 0;
                display: block;
                text-align: center;
                width: 50%;
                height: 100%;    
            }
            .box-1{
                border-right: 1px solid #000;
            }
            .content{
                display: inline-block;
                min-height: 100vh;
                padding: 20px;
                margin-top: 60px;
                /*border: 10px solid #000;*/
                width: 100%;
            }
             .event1{/*add more events*/
                width: 310px;
                height: 500px;
                margin-right: 10px;
                background-color:#f4d587;
                border: 5px solid #ff8c2e;
                box-shadow: 5px 5px 0px #ff8c2e;
                border-radius: 10px;
            }
            .event1:hover{
                transition-property: transform box-shadow;
                transition-duration: 0.5s;
                transition-timing-function: ease;
                transform: translate(-4px, -2px);
                border: 5px solid #ffb070;
                box-shadow: 9px 7px 0px #ffb070
            }
              @media screen and (max-width: 800px){
                .content{
                    display: block;
                }
                .event1{
                    margin: 0 auto;

                }
            }
            .powderpuff-audition{    
                display: block;
                text-align: center;
                /*border: 10px solid #000;*/
                }
            .con-title{
                width: 100%;
                padding: 10px;
                margin-top: 5px;
            }
            p{
                font-family:'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif, sans-serif;
                color:#000;
            }
            img{
                width: 300px;
                padding: none !important;
                margin: none !important;
                border-radius: 5px;
                border-bottom: 3px solid #ff8c2e98;
            }
            @media screen and (max-width: 340px){
                img{
                    width: 100%;
                }
                .event1{
                    width: 98%;
                }
                .con-title{
                    margin: auto;
                }

            }
